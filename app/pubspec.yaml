name: boraset
description: BoraSet — copiloto de treino adaptativo em tempo real.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  boraset_domain:
    path: ../packages/boraset_domain
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Permite rodar o MESMO SQL dos testes, sem emulador.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    # Núcleo neutro de idioma — carregado sempre.
    - assets/data/catalog/
    # Pacotes por idioma — só o do usuário é lido em runtime,
    # mas todos vão no bundle (1,3 MB para os 18).
    - assets/data/l10n/
    - assets/data/locales.json
